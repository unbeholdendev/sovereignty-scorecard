dns:
  - name: PowerDNS
    repo: https://github.com/PowerDNS/pdns
    selfHostUrl: https://doc.powerdns.com/authoritative/installation.html
  - name: Knot DNS
    repo: https://github.com/CZ-NIC/knot
    licence: GPL-2.0-or-later
    selfHostUrl: https://www.knot-dns.cz/docs/latest/html/installation.html
  - name: NSD
    repo: https://github.com/NLnetLabs/nsd
    licence: BSD-3-Clause
    selfHostUrl: https://nsd.docs.nlnetlabs.nl/en/latest/installation.html
mail:
  - name: Stalwart
    repo: https://github.com/stalwartlabs/stalwart
    licence: AGPL-3.0-only
    selfHostUrl: https://stalw.art/docs/install/get-started
    articles:
      - https://unbeholden.dev/blog/self-hosting-email-with-stalwart
  - name: Mailcow
    repo: https://github.com/mailcow/mailcow-dockerized
    selfHostUrl: https://docs.mailcow.email/getstarted/install/
    managedUrl: https://www.servercow.de
  - name: Mox
    repo: https://github.com/mjl-/mox
    selfHostUrl: https://www.xmox.nl/install/
