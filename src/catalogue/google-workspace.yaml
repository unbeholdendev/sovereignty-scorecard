name: Google Workspace
matches: [google-workspace]
category: mail
company: Google
openSource: false
alternatives:
  - name: docker-mailserver
    repo: https://github.com/docker-mailserver/docker-mailserver
    selfHostUrl: https://docker-mailserver.github.io/docker-mailserver/latest/usage/
  - name: Stalwart
    repo: https://github.com/stalwartlabs/stalwart
    licence: AGPL-3.0-only
    selfHostUrl: https://stalw.art/docs/install/get-started
    articles:
      - https://unbeholden.dev/blog/self-hosting-email-with-stalwart
  - name: Mailcow
    repo: https://github.com/mailcow/mailcow-dockerized
    selfHostUrl: https://docs.mailcow.email/getstarted/install/
    managedUrl: https://www.servercow.de
